<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <div id="all">

        </div>

        </div>
        <div id="myProgress3">
            <div id="myBar3"></div>
        </div>
        <div id="click">
          <img id="image" onclick="move()"src="giphy (2).gif" width="100px" height="100px">
          <img id="image" onclick="move2()"src="giphy (1).gif" width="100px" height="100px">
          <img id="image" onclick="move3()"src="giphy (3).gif" width="100px" height="100px">
        </div>
        
    </div>

<script>
    let width = 0;

    const elem = document.getElementById("myBar");
    const elem2 = document.getElementById("myBar2");
    const elem3 = document.getElementById("myBar3"); 

function updateBar() {
  elem.style.width = width + "%";
  elem.innerHTML = "Happiness " + width + "%";
}

function move() {
  if (width < 100) {
    width += 5;

    if (width > 100) {
      width = 100;
    }

    updateBar();
  }
}

setInterval(() => {
  if (width > 0) {
    width -= 5;

    if (width < 0) {
      width = 0;
    }

    updateBar();
  }
}, 5000);

let width2 = 0;

function updateBar2() {
  elem2.style.width = width2 + "%";
  elem2.innerHTML = "Energy " + width2 + "%";
}

function move2() {
  isGrowing = true;
  let targetWidth = width2 + 50;
  if (targetWidth > 100) targetWidth = 100;

  let timer = setInterval(() => {
    if (width2 < targetWidth) {
      width2 += 1;
      updateBar2();
    } else {
      clearInterval(timer);
      isGrowing = false;
    }
  }, 1000); 
}

setInterval(() => {
  if (width2 > 0 && !isGrowing) {
    width2 -= 5;
    if (width2 < 0) width2 = 0;
    updateBar2();
  }
}, 8000);

let width3 = 0;
function updateBar3() {
  elem3.style.width = width3 + "%";
  elem3.innerHTML ="Hunger " + width3 + "%";
}

function move3() {

  
  if (width3 < 100) {

    updateBar3();
  
  }

setInterval(() => {

    }

  }

</script>
